version: '3.8'

services:
  # Database MySQL
  db:
    image: mysql:8.0
    container_name: kgrsn-db
    restart: always
    environment:
      MYSQL_DATABASE: kgrsn_db
      # Gunakan password yang kuat di lingkungan produksi
      MYSQL_ROOT_PASSWORD: kgrsn_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kgrsn-network

  # Backend FastAPI
  backend:
    build: ./backend
    container_name: kgrsn-backend
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=kgrsn_root_password
      - DB_NAME=kgrsn_db
      - SECRET_KEY=kgrsn-super-secret-key-ganti-ini-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - UPLOAD_DIR=uploads
      - GENERATED_DIR=generated
    volumes:
      - backend_uploads:/app/uploads
      - backend_generated:/app/generated
    ports:
      - "8000:8000"
    networks:
      - kgrsn-network

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      args:
        # Ganti dengan domain publik backend Anda saat dideploy di VPS produksi (misal https://api.kgrsn.com/api)
        - NEXT_PUBLIC_API_URL=https://api.kgrsn.site/api
    container_name: kgrsn-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - kgrsn-network

networks:
  kgrsn-network:
    driver: bridge

volumes:
  mysql_data:
  backend_uploads:
  backend_generated:

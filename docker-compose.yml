services:
  # Database MySQL
  db:
    image: mysql:8.0
    container_name: kgrsn-db
    restart: always
    environment:
      MYSQL_DATABASE: kgrsn_db
      MYSQL_ROOT_PASSWORD: kgrsn_root_password
      # Batasi buffer MySQL agar hemat RAM di server kecil
      MYSQL_INNODB_BUFFER_POOL_SIZE: 128M
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=50
      --performance-schema=OFF
    # ports 3306 dihapus agar database terisolasi penuh di docker network
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kgrsn-network
    deploy:
      resources:
        limits:
          memory: 256M

  # Backend FastAPI
  backend:
    build: ./backend
    container_name: kgrsn-backend
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=kgrsn_root_password
      - DB_NAME=kgrsn_db
      - SECRET_KEY=kgrsn-super-secret-key-ganti-ini-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - UPLOAD_DIR=uploads
      - GENERATED_DIR=generated
      - COMPANY_ADDRESS=Kota Cirebon
      - COMPANY_PHONE=0822-4022-0946
    volumes:
      - backend_uploads:/app/uploads
      - backend_generated:/app/generated
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - kgrsn-network
    deploy:
      resources:
        limits:
          memory: 256M

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=https://api.kgrsn.site/api
    container_name: kgrsn-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - kgrsn-network
    deploy:
      resources:
        limits:
          memory: 350M

networks:
  kgrsn-network:
    driver: bridge

volumes:
  mysql_data:
  backend_uploads:
  backend_generated:
